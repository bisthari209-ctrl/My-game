<!DOCTYPE html>
<html lang="ne">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deposit Balance</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { 
            --primary: #2c3e50; 
            --esewa: #60bb46;
            --khalti: #5c2d91;
            --imepay: #ed1c24;
            --banking: #3498db;
            --white: #ffffff; 
        }
        body { font-family: 'Poppins', sans-serif; margin: 0; background: #f0f2f5; color: #333; overflow-x: hidden; }
        
        .header { background: var(--primary); color: white; padding: 15px; display: flex; align-items: center; gap: 15px; }
        .header a { color: white; text-decoration: none; }
        .header h3 { margin: 0; font-size: 1rem; }

        .container { padding: 10px; max-width: 450px; margin: auto; }

        .deposit-notice {
            background: #fff9c4; border-left: 4px solid #fbc02d;
            padding: 8px 12px; border-radius: 6px; font-size: 0.75rem;
            margin-bottom: 12px; color: #5d4037; font-weight: 500;
        }

        .payment-grid {
            display: grid; grid-template-columns: repeat(4, 1fr);
            gap: 8px; margin-bottom: 12px;
        }
        .pay-item {
            background: white; padding: 8px 4px; border-radius: 12px;
            text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            cursor: pointer; border: 2px solid transparent; transition: 0.2s;
        }
        .pay-item img { width: 32px; height: 32px; border-radius: 6px; margin-bottom: 4px; }
        .pay-item span { display: block; font-size: 0.65rem; font-weight: 700; }
        .pay-item.active { border-color: var(--primary); background: #eef2f3; }

        .wallet-card { 
            display: none; background: var(--white); border-radius: 15px; 
            padding: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); 
            text-align: center; animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .wallet-header { font-weight: 700; font-size: 1rem; margin-bottom: 10px; }

        .qr-box {
            background: #f9f9f9; padding: 8px; border-radius: 10px;
            display: inline-block; margin-bottom: 8px; border: 1px solid #eee;
        }
        .qr-img { width: 140px; height: 140px; display: block; }

        .action-row { display: flex; justify-content: center; gap: 8px; margin-bottom: 12px; }
        .btn-action { 
            padding: 6px 12px; border-radius: 6px; border: none; font-size: 0.75rem; 
            cursor: pointer; display: flex; align-items: center; gap: 4px;
            background: #f0f0f0; color: #333; font-weight: 600;
        }
        
        .num-display { font-weight: bold; font-size: 0.9rem; color: var(--primary); margin-bottom: 10px; display: block; }

        .input-row { display: flex; gap: 10px; text-align: left; margin-bottom: 12px; }
        .input-group { flex: 1; }
        label { display: block; font-size: 0.7rem; font-weight: 600; color: #777; margin-bottom: 3px; }
        .input-box { 
            width: 100%; padding: 10px; border: 1px solid #ddd; 
            border-radius: 8px; box-sizing: border-box; font-size: 0.85rem;
        }

        .btn-done { 
            color: white; border: none; width: 100%; padding: 12px; 
            border-radius: 10px; font-weight: bold; font-size: 0.9rem; cursor: pointer; 
        }

        .esewa-bg { background: var(--esewa); }
        .khalti-bg { background: var(--khalti); }
        .imepay-bg { background: var(--imepay); }
        .banking-bg { background: var(--banking); }

        #toast { visibility: hidden; min-width: 200px; background: #333; color: #fff; text-align: center; border-radius: 30px; padding: 10px; position: fixed; z-index: 4000; left: 50%; bottom: 30px; transform: translateX(-50%); font-size: 0.8rem; }
        #toast.show { visibility: visible; }
    </style>
</head>
<body>

    <div id="toast">सन्देश...</div>

    <div class="header">
        <a href="profile.html"><i class="fas fa-arrow-left"></i></a>
        <h3>Deposit Balance</h3>
    </div>

    <div class="container">
        <div class="deposit-notice">
            <i class="fas fa-info-circle"></i> भुक्तानीको लागि वालेट रोज्नुहोस्:
        </div>
        
        <div class="payment-grid">
            <div id="btn_esewa" class="pay-item active" onclick="showWallet('esewa', this)">
                <img src="https://i.ibb.co/XrVYFwL7/esewa-icon.png">
                <span>eSewa</span>
            </div>
            <div class="pay-item" onclick="showWallet('khalti', this)">
                <img src="https://i.ibb.co/4wL8s0x9/khalti-icon.png">
                <span>Khalti</span>
            </div>
            <div class="pay-item" onclick="showWallet('imepay', this)">
                <img src="https://i.ibb.co/Qv8mWDY0/imepay-icon.png">
                <span>IME Pay</span>
            </div>
            <div class="pay-item" onclick="showWallet('banking', this)">
                <img src="https://i.ibb.co/ycF2R2J6/banking-icon.png">
                <span>Banking</span>
            </div>
        </div>

        <div id="card_esewa" class="wallet-card" style="display: block;">
            <div class="wallet-header" style="color:var(--esewa)">eSewa Payment</div>
            <div class="qr-box"><img src="https://i.ibb.co/vR1Fm9w/esewa-qr.png" class="qr-img"></div>
            <span class="num-display">9748253225</span>
            <div class="action-row">
                <button class="btn-action" onclick="copyNum('9748253225')"><i class="fas fa-copy"></i> Copy</button>
                <button class="btn-action" onclick="downloadQR('https://i.ibb.co/vR1Fm9w/esewa-qr.png', 'eSewa')"><i class="fas fa-download"></i> Save</button>
            </div>
            <div class="input-row">
                <div class="input-group"><label>Amount (रू ५०+)</label><input type="number" class="input-box" id="amt_esewa" placeholder="0.00"></div>
                <div class="input-group"><label>Screenshot</label><input type="file" class="input-box" id="file_esewa" accept="image/*"></div>
            </div>
            <button class="btn-done esewa-bg" onclick="handleDeposit(event, 'esewa')">SUBMIT NOW</button>
        </div>

        <div id="card_khalti" class="wallet-card">
            <div class="wallet-header" style="color:var(--khalti)">Khalti Payment</div>
            <div class="qr-box"><img src="https://i.ibb.co/0jYBY45J/khalti-qr.png" class="qr-img"></div>
            <span class="num-display">9748253225</span>
            <div class="action-row">
                <button class="btn-action" onclick="copyNum('9748253225')"><i class="fas fa-copy"></i> Copy</button>
                <button class="btn-action" onclick="downloadQR('https://i.ibb.co/0jYBY45J/khalti-qr.png', 'Khalti')"><i class="fas fa-download"></i> Save</button>
            </div>
            <div class="input-row">
                <div class="input-group"><label>Amount (रू ५०+)</label><input type="number" class="input-box" id="amt_khalti" placeholder="0.00"></div>
                <div class="input-group"><label>Screenshot</label><input type="file" class="input-box" id="file_khalti" accept="image/*"></div>
            </div>
            <button class="btn-done khalti-bg" onclick="handleDeposit(event, 'khalti')">SUBMIT NOW</button>
        </div>

        <div id="card_imepay" class="wallet-card">
            <div class="wallet-header" style="color:var(--imepay)">IME Pay Payment</div>
            <div class="qr-box"><img src="https://i.ibb.co/rG7kNxk2/imepay-qr.png" class="qr-img"></div>
            <span class="num-display">9748253225</span>
            <div class="action-row">
                <button class="btn-action" onclick="copyNum('9748253225')"><i class="fas fa-copy"></i> Copy</button>
                <button class="btn-action" onclick="downloadQR('https://i.ibb.co/rG7kNxk2/imepay-qr.png', 'IMEPay')"><i class="fas fa-download"></i> Save</button>
            </div>
            <div class="input-row">
                <div class="input-group"><label>Amount (रू ५०+)</label><input type="number" class="input-box" id="amt_imepay" placeholder="0.00"></div>
                <div class="input-group"><label>Screenshot</label><input type="file" class="input-box" id="file_imepay" accept="image/*"></div>
            </div>
            <button class="btn-done imepay-bg" onclick="handleDeposit(event, 'imepay')">SUBMIT NOW</button>
        </div>

        <div id="card_banking" class="wallet-card">
            <div class="wallet-header" style="color:var(--banking)">Fonepay (Banking)</div>
            <div class="qr-box"><img src="https://i.ibb.co/gFD30p5G/banking-qr.png" class="qr-img"></div>
            <span class="num-display">RK LUDO CENTER</span>
            <div class="action-row">
                <button class="btn-action" onclick="downloadQR('https://i.ibb.co/gFD30p5G/banking-qr.png', 'Banking')"><i class="fas fa-download"></i> Save QR</button>
            </div>
            <div class="input-row">
                <div class="input-group"><label>Amount (रू ५०+)</label><input type="number" class="input-box" id="amt_banking" placeholder="0.00"></div>
                <div class="input-group"><label>Screenshot</label><input type="file" class="input-box" id="file_banking" accept="image/*"></div>
            </div>
            <button class="btn-done banking-bg" onclick="handleDeposit(event, 'banking')">SUBMIT NOW</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getDatabase, ref, push, update, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAGjZQaWHGJ2EFDIyIKdVKErk_UjnsxiZ8",
            authDomain: "mero-ludo.firebaseapp.com",
            projectId: "mero-ludo",
            storageBucket: "mero-ludo.firebasestorage.app",
            messagingSenderId: "1094014617347",
            appId: "1:1094014617347:web:348cec65cea83c5a8fcb36"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);
        const IMGBB_API_KEY = "21e168aa171998d73ef8f4bc18d5d282";

        window.showWallet = (id, el) => {
            document.querySelectorAll('.wallet-card').forEach(c => c.style.display = 'none');
            document.querySelectorAll('.pay-item').forEach(i => i.classList.remove('active'));
            document.getElementById('card_' + id).style.display = 'block';
            el.classList.add('active');
        };

        window.copyNum = (num) => {
            navigator.clipboard.writeText(num);
            showToast("कपी गरियो: " + num);
        };

        window.downloadQR = (url, name) => {
            const link = document.createElement("a"); link.href = url; link.download = name + "_QR.png";
            document.body.appendChild(link); link.click(); document.body.removeChild(link);
        };

        // --- Optimized Deposit Function with Compression ---
        window.handleDeposit = async (event, method) => {
            const btn = event.target;
            const amt = document.getElementById(`amt_${method}`).value;
            const fileInput = document.getElementById(`file_${method}`);
            
            if (!auth.currentUser) return showToast("लगइन गर्नुहोस्!");
            if (!amt || amt < 50) return showToast("रू ५० भन्दा कम भयो!");
            if (!fileInput.files[0]) return showToast("Screenshot छान्नुहोस्!");

            btn.innerText = "Fast Uploading..."; btn.disabled = true;

            try {
                // Compression Logic: Reduces file size to speed up ImgBB upload
                const file = fileInput.files[0];
                const blob = await new Promise((resolve) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const scale = Math.min(800 / img.width, 1); // Limits width to 800px
                        canvas.width = img.width * scale;
                        canvas.height = img.height * scale;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        canvas.toBlob(resolve, 'image/jpeg', 0.6); // 60% quality compression
                    };
                    img.src = URL.createObjectURL(file);
                });

                const formData = new FormData();
                formData.append("image", blob, "proof.jpg");

                const res = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, { method: "POST", body: formData });
                const result = await res.json();

                if (result.success) {
                    const userSnap = await get(ref(db, 'users/' + auth.currentUser.uid));
                    const userData = userSnap.val();
                    const newKey = push(ref(db, 'admin/deposits')).key;
                    const depData = {
                        uid: auth.currentUser.uid,
                        name: userData?.name || "User",
                        numericID: userData?.numericID || "N/A",
                        amount: parseFloat(amt),
                        method: method.toUpperCase(),
                        status: 'pending',
                        proofUrl: result.data.url,
                        time: Date.now(),
                        type: 'Deposit'
                    };
                    const updates = {};
                    updates[`/admin/deposits/${newKey}`] = depData;
                    updates[`/users/${auth.currentUser.uid}/history/${newKey}`] = depData;
                    await update(ref(db), updates);
                    showToast("रिक्वेस्ट सफल!");
                    setTimeout(() => window.location.href = "profile.html", 1500);
                } else {
                    showToast("अपलोड फेल!");
                }
            } catch (e) { showToast("Error: " + e.message); }
            finally { btn.innerText = "SUBMIT NOW"; btn.disabled = false; }
        };

        function showToast(msg) {
            const t = document.getElementById("toast"); t.innerText = msg; t.className = "show";
            setTimeout(() => { t.className = ""; }, 2500);
        }

        onAuthStateChanged(auth, (user) => { if (!user) window.location.href = "index.html"; });
    </script>
</body>
</html>
